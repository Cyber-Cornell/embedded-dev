[build]
target = "thumbv6m-none-eabi" # Cortex-M0+ (MSPM0)

[target.thumbv6m-none-eabi]
# Flashes over the LaunchPad's on-board XDS110: `cargo run --release`.
runner = "probe-rs run --chip MSPM0L2228"
# cortex-m-rt's link.x, which INCLUDEs memory.x, is the default.
# mspm0l2228.ld is a single-file copy of the two to edit, e.g. to move the
# program behind a bootloader; to use it, swap the rustflags lines.
rustflags = ["-C", "link-arg=-Tlink.x"]
# rustflags = ["-C", "link-arg=-Tmspm0l2228.ld"]
