[build]
# kernel8.img for the Pi 3, 4, 5 and Zero 2 W. The firmware may leave the
# FP/SIMD registers trapped, so use the soft-float target. For the Pi Zero /
# Zero W (kernel.img): cargo run --release --target armv6-none-eabihf
target = "aarch64-unknown-none-softfloat"

# `cargo run` writes the kernel image, GPU firmware and config.txt to
# $RPI_BOOT_DIR (your mounted SD card), else boot/ next to the ELF.
[target.aarch64-unknown-none-softfloat]
runner = "rpi-boot"
rustflags = ["-C", "link-arg=-Tlink64.ld"]

[target.armv6-none-eabihf]
runner = "rpi-boot"
rustflags = ["-C", "link-arg=-Tlink32.ld"]

[unstable]
# armv6-none-eabihf is a tier-3 target without a prebuilt core library. Build
# core from source for both targets, plus memcpy/memset since there's no libc.
build-std = ["core"]
build-std-features = ["compiler-builtins-mem"]
