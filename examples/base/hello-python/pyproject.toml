[project]
name = "hello"
version = "0.1.0"
description = "Hello world for this computer"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
hello = "hello:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff.lint]
select = [
  "E", "W", # pycodestyle
  "F",      # pyflakes
  "I",      # import sorting
  "N",      # naming
  "B",      # bugbear
  "UP",     # pyupgrade
  "SIM",    # simplify
  "C4",     # comprehensions
  "RET",    # return statements
  "PTH",    # pathlib
  "PT",     # pytest style
  "RUF",    # ruff-specific
]

[tool.pyright]
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
