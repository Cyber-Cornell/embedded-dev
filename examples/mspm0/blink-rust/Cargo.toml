[package]
name = "blink"
version = "0.1.0"
edition = "2024"

# embassy-mspm0 isn't on crates.io yet, so the embassy crates come from one
# pinned commit of its repository (Cargo.lock records it too).
[dependencies]
cortex-m = { version = "0.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7"
panic-halt = "1.0"
# Pick the feature matching your part and package, e.g. mspm0g3507pm for the
# LP-MSPM0G3507.
embassy-mspm0 = { git = "https://github.com/embassy-rs/embassy", rev = "f16efeffe37581092ec184718e6fdb1620393214", features = ["mspm0l2228pn", "rt", "time-driver-any"] }
embassy-executor = { git = "https://github.com/embassy-rs/embassy", rev = "f16efeffe37581092ec184718e6fdb1620393214", features = ["platform-cortex-m", "executor-thread"] }
embassy-time = { git = "https://github.com/embassy-rs/embassy", rev = "f16efeffe37581092ec184718e6fdb1620393214" }

[[bin]]
name = "blink"
test = false
bench = false

[profile.release]
debug = 2
lto = true
opt-level = "s"
